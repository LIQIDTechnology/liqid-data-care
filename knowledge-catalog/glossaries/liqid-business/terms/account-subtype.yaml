kind: glossary-term
id: account-subtype
parent: account-structure
display_name: Account Subtype
description: How the contracting party is shaped. Also called account type. A flag, not a node in the account tree.
labels:
  domain: wealth
  grain: party
overview: |
  Values: single, joint, child, business. Not a separate object in
  Qplix, Polarix, or Upvest.

  Next Gen stores one subtype row per account in single_account,
  joint_account, child_account, or business_account. int_next_gen_account
  derives the four values.

  Salesforce Account.Type (stg_sf_account.account_type) is an attribute
  on Account. It is not the same picklist as Next Gen.
contacts:
