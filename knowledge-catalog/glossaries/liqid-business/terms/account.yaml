kind: glossary-term
id: account
parent: account-structure
display_name: Account
description: Vendor name for contracting party in Next Gen and Salesforce. Same concept; different vocabulary.
labels:
  domain: wealth
  grain: party
  vocabulary: vendor
overview: |
  Next Gen account and Salesforce Account are the contracting party.
  LIQID's name for the same thing is contracting party.

  Do not treat either as a banking partner. In Salesforce that is
  Financial Account (see financial-account); in Next Gen that is
  custodian.

  Salesforce Account and Next Gen account sit at the same level but are
  not guaranteed 1:1. Bridge: account.external_salesforce_id.

  Shape is account-subtype. Next Gen uses subtype tables; Salesforce
  Account.Type is not the same picklist.
contacts:
