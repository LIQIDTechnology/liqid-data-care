kind: glossary-term
id: contracting-party
parent: account-structure
display_name: Contracting Party
description: The legal party that holds the contract. Exists whether or not that party has ever invested, which is why it is not called an investor.
labels:
  domain: wealth
  grain: party
overview: |
  Root entity in Polarix. Banking partners, portfolios, and external reference
  accounts hang off it. Shape (single, joint, child, business) is
  account-subtype, a flag not a child node.

  Maps to:
  - Account in Next Gen and Salesforce. See account.
  - Legal Entity in Qplix. See qplix-legal-entity. The Qplix group above
    that entity is not the contracting party. See qplix-group.
  - User in Upvest. See upvest-user. Same vendor object, two roles.

  Notes:
  - Where Polarix translates Qplix wire data, a column may still read investor.
    That is Qplix vocabulary, not ours.
  - Fund limited partners on a capital call, and litmus fund-share importer
    columns, are not contracting parties.
  - Salesforce Account and Next Gen account sit at the same level but are not
    guaranteed 1:1. See account.
