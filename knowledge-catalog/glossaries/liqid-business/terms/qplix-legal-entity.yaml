kind: glossary-term
id: qplix-legal-entity
parent: account-structure
display_name: Qplix Legal Entity
description: Vendor name for the legal entity in Qplix. Same concept as contracting party; different vocabulary.
labels:
  domain: wealth
  grain: party
  vocabulary: vendor
overview: |
  The Legal Entity in Qplix is the contracting party. It hangs under a
  Qplix group. Grain is one LE. Its id lands on Next Gen account.qplix_id
  and on Salesforce Financial Account.

  Analytics: landing_qplix.legal_entities. There is no stg_qplix_account.

  Do not treat this as the Virtual Entity (that is the portfolio node).
  Do not treat the parent group as the contracting party. See qplix-group.
contacts:
